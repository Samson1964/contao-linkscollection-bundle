# Dienste der Linksammlung
#
# Hinweis: Hier stand früher ein _instanceof-Block für FrameworkAwareInterface
# und ContainerAwareInterface. Keine Klasse dieser Erweiterung setzt die beiden
# um, und ContainerAwareInterface gibt es seit Symfony 7 nicht mehr — der Block
# verhinderte damit den Containerbau unter Contao 5.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Klickweiterleitung, Suche und die Sammelprüfung sind über Routen
    # erreichbar und müssen deshalb öffentliche Dienste sein.
    Schachbulle\ContaoLinkscollectionBundle\Controller\WeiterleitungController:
        public: true

    Schachbulle\ContaoLinkscollectionBundle\Controller\SucheController:
        public: true

    Schachbulle\ContaoLinkscollectionBundle\Controller\PruefenController:
        public: true
