# Routen der Linksammlung
#
# _scope: frontend sorgt dafür, dass Contao die Anfrage als Frontend-Anfrage
# behandelt (Sprache, Insert-Tags, Mitgliederanmeldung).
# _token_check: false schaltet die Prüfung des Anfrage-Tokens ab — beide Routen
# werden per GET aus dem Seiteninhalt heraus aufgerufen und ändern keine Daten,
# die einen Angreifer lohnen würden.

linkscollection_go:
    path: /linkscollection/go/{id}
    defaults:
        _controller: Schachbulle\ContaoLinkscollectionBundle\Controller\WeiterleitungController
        _scope: frontend
        _token_check: false
    requirements:
        id: \d+
    methods: [GET]

linkscollection_suche:
    path: /linkscollection/suche
    defaults:
        _controller: Schachbulle\ContaoLinkscollectionBundle\Controller\SucheController
        _scope: frontend
        _token_check: false
    methods: [GET]

# Liegt unter /contao/ und damit in der Zone, die Contao ohnehin nur
# angemeldeten Backend-Benutzern öffnet — siehe PruefenController.
linkscollection_pruefen:
    path: /contao/linkscollection/pruefen/{id}
    defaults:
        _controller: Schachbulle\ContaoLinkscollectionBundle\Controller\PruefenController
        _scope: backend
        _token_check: false
    requirements:
        id: \d+
    methods: [GET]
